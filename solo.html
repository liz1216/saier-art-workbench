<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>赛尔·单头镜头</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#d8dadd;font:12px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    #stage{position:fixed;inset:0;background:#000}#stageCanvas{display:block;width:100%;height:100%;position:absolute;inset:0}#stageStatus{position:absolute;left:14px;top:12px;color:#70757a;font-size:11px;letter-spacing:.08em;pointer-events:none}
    #loading{position:absolute;inset:0;display:grid;place-items:center;color:#7d8287;letter-spacing:.24em;background:#000;transition:opacity .5s;pointer-events:none}#loading.off{opacity:0}
    #panel{position:fixed;right:0;top:0;bottom:0;width:min(340px,92vw);overflow:auto;padding:14px;background:rgba(8,9,11,.95);border-left:1px solid #282d32;z-index:5;display:none}#panel.on{display:block}
    #panel h3{font-size:11px;color:#858b91;font-weight:500;letter-spacing:.18em;margin:14px 0 7px;border-bottom:1px solid #262b30;padding-bottom:5px}.row{display:grid;grid-template-columns:112px 1fr 46px;gap:7px;align-items:center;margin:5px 0}.row span{color:#b9bec3}.row input[type=range]{width:100%}.row output{color:#7f878e;text-align:right}.row input[type=color],.row select{grid-column:2/4;width:100%;background:#15181b;color:#e3e5e7;border:1px solid #343a40;border-radius:5px;padding:4px}.row input[type=checkbox]{grid-column:2;justify-self:start;accent-color:#d0d3d5}
    #panelFoot{display:flex;gap:7px;margin-top:14px}button{appearance:none;border:1px solid #3b4147;background:#14171a;color:#e1e4e6;border-radius:7px;padding:7px 10px;font:inherit;cursor:pointer}button:hover{border-color:#8a9198}#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);opacity:0;padding:6px 12px;border-radius:7px;background:#15181b;z-index:8;transition:opacity .25s}#toast.on{opacity:1}[hidden]{display:none!important}
  </style>
</head>
<body>
  <div id="stage"><canvas id="stageCanvas"></canvas><span id="stageStatus"></span><div id="loading">正在载入单头模型…</div></div>
  <aside id="panel"><div id="pbody"></div><div id="panelFoot"><button id="resetLook" type="button">恢复固定起点</button><button id="copyParams" type="button">复制参数 JSON</button></div></aside>
  <div id="toast"></div>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
  <script type="module" src="./solo-scene.mjs?v=saier-1"></script>
  <script>
    const $=id=>document.getElementById(id),toast=message=>{const node=$('toast');node.textContent=message;node.classList.add('on');clearTimeout(toast.timer);toast.timer=setTimeout(()=>node.classList.remove('on'),1400)};
    const CAMS=[['dist','离脸距离',.6,8,.01],['fov','镜头视角',6,60,.5],['height','相机高度',1.3,2.8,.005],['x','左右',-1,1,.005]];
    const makeRange=(label,min,max,step,value,on)=>{const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=label;const input=document.createElement('input');input.type='range';Object.assign(input,{min,max,step,value});const output=document.createElement('output');output.textContent=(+value).toFixed(2);input.oninput=()=>{output.textContent=(+input.value).toFixed(2);on(+input.value)};row.append(name,input,output);return row};
    function buildPanel(){
      const S=window.saierScene;if(!S?.ready||!window.soloCam)return;const body=$('pbody');body.replaceChildren();const look=S.getLook(),cam=window.soloCam();
      const cameraTitle=document.createElement('h3');cameraTitle.textContent='相机';body.append(cameraTitle);
      for(const [key,label,min,max,step] of CAMS)body.append(makeRange(label,min,max,step,cam[key],value=>window.soloCam({[key]:value})));
      for(const group of S.schema){const title=document.createElement('h3');title.textContent=group.group;body.append(title);for(const item of group.items){
        if(item.type==='color'){const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=item.label;const input=document.createElement('input');input.type='color';input.value=look[item.key];input.oninput=()=>S.setLook({[item.key]:input.value});row.append(name,input);body.append(row)}
        else if(item.type==='bool'){const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=item.label;const input=document.createElement('input');input.type='checkbox';input.checked=Boolean(look[item.key]);input.onchange=()=>S.setLook({[item.key]:input.checked});row.append(name,input);body.append(row)}
        else if(item.type==='select'){const row=document.createElement('div');row.className='row';const name=document.createElement('span');name.textContent=item.label;const select=document.createElement('select');for(const [value,label] of item.options){const option=document.createElement('option');option.value=value;option.textContent=label;option.selected=look[item.key]===value;select.append(option)}select.onchange=()=>S.setLook({[item.key]:select.value});row.append(name,select);body.append(row)}
        else body.append(makeRange(item.label,item.min,item.max,item.step,look[item.key],value=>S.setLook({[item.key]:value})));
      }}
    }
    $('resetLook').onclick=()=>{const S=window.saierScene;if(S){S.applyPreset('black',{fresh:true});buildPanel();toast('已恢复固定 theater 起点')}};
    $('copyParams').onclick=async()=>{try{const text=JSON.stringify({cam:window.soloCam(),look:window.saierScene.getLook()},null,2);await navigator.clipboard.writeText(text);toast('参数已复制')}catch{toast('浏览器不允许复制，请用工作台导出参数')}};
    window.rebuildSoloPanel=buildPanel;
    const wait=setInterval(()=>{if(window.saierScene?.ready&&window.soloCam){clearInterval(wait);buildPanel();$('loading')?.classList.add('off')}},250);
  </script>
</body>
</html>
